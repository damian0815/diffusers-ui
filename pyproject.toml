[project]
name = "diffusers-ui"
version = "0.1.0"
description = "Self-contained image generation UI wrapping Hugging Face Diffusers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "diffusers>=0.26",
    "transformers>=4.40",
    "accelerate>=0.30",
    "pillow>=10.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "huggingface-hub>=0.22",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tqdm",
    "compel>=2.3.1",
    "bitsandbytes",
    "python-multipart",
]

[project.optional-dependencies]
gpu = [
    # Install on CUDA machines for xformers memory-efficient attention:
    #   uv pip install "diffusers-ui[gpu]"
    "xformers>=0.0.26",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
